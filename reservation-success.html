<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reservation Confirmed · Moonlight Temple</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg); padding: 20px; }
    .ticket { background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .ticket h2 { font-family: var(--font-serif); color: var(--gold-lite); font-size: 2rem; margin-bottom: 10px; }
    .ticket p { color: var(--text-dim); margin-bottom: 30px; font-size: 0.9rem; }
    .qr-box { background: #fff; padding: 20px; border-radius: 12px; display: inline-block; margin-bottom: 30px; }
    .qr-box img { width: 200px; height: 200px; display: block; }
    .details { text-align: left; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); }
    .details p { margin-bottom: 10px; color: var(--text); font-size: 1rem; }
    .details span { color: var(--gold); font-weight: 600; float: right; }
    .btn { display: inline-block; width: 100%; text-align: center; padding: 15px; background: var(--gold); color: var(--bg); text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
    .btn:hover { background: var(--gold-lite); }
  </style>
</head>
<body>
    <body>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="ticket">
    <h2>Reservation Confirmed! ✨</h2>
    <p>Show this QR code at the entrance.</p>
    <p>Check Your Notification box for updates on Your reservation status.</p>
    
    <div class="qr-box">
    
      <img id="qrImage" src="" alt="Reservation QR">
    </div>

    <div class="details" id="resDetails">
    
      <p style="text-align:center;">Loading details...</p>
    </div>

    <a href="index.html" class="btn">Back to Home</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  
    const firebaseConfig = { 
        apiKey: "AIzaSyBxjDMZGVPRfx1altzXvwNKnu9sjdfk8kk",
        authDomain: "korean-cafe-b26a8.firebaseapp.com",
        projectId: "korean-cafe-b26a8",
        storageBucket: "korean-cafe-b26a8.firebasestorage.app",
        messagingSenderId: "823464413100",
        appId: "1:823464413100:web:444b9b7bdf37826de89c09",
        measurementId: "G-ZDPWRWL54R"
     };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const resId = urlParams.get('id');

    if(resId) {
     
      const docSnap = await getDoc(doc(db, "reservations", resId));
      
      if(docSnap.exists()) {
        const data = docSnap.data();
        
        document.getElementById('resDetails').innerHTML = `
          <p>Name: <span>${data.name}</span></p>
          <p>Date: <span>${data.date}</span></p>
          <p>Time: <span>${data.time}</span></p>
          <p>Guests: <span>${data.guests}</span></p>
        `;

        const qrData = window.location.origin + window.location.pathname.replace('reservation-success.html', 'reservation-details.html') + '?id=' + resId;
        
       
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
      }
    }

    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if(dot) { dot.style.left = mx + 'px'; dot.style.top = my + 'px'; }
    });

    function animateRing() {
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      if(ring) { ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; }
      requestAnimationFrame(animateRing);
    }
    animateRing();

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>
</body>
</html>
