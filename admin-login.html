<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · Hanguk Haven</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background: #08070a; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #0d0b10; padding: 40px; border-radius: 16px; border: 1px solid rgba(201,169,97,0.3); width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
    h2 { color: #c9a961; font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 20px; }
    input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 1rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: #c9a961; }
    button { width: 100%; padding: 15px; background: #c9a961; color: #08070a; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover { background: #e8d4a0; }
    #errorMsg { color: #ef4444; font-size: 0.9rem; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Admin Portal</h2>
    <form id="adminLoginForm">
      <input type="email" id="adminEmail" placeholder="Admin Email" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit">Secure Login</button>
    </form>
    <p id="errorMsg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBxjDMZGVPRfx1altzXvwNKnu9sjdfk8kk",
  authDomain: "korean-cafe-b26a8.firebaseapp.com",
  projectId: "korean-cafe-b26a8",
  storageBucket: "korean-cafe-b26a8.firebasestorage.app",
  messagingSenderId: "823464413100",
  appId: "1:823464413100:web:444b9b7bdf37826de89c09",
  measurementId: "G-ZDPWRWL54R"
     };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPass').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        errorMsg.innerText = "Authenticating...";
        errorMsg.style.color = "#c9a961";
        
        await signInWithEmailAndPassword(auth, email, password);
        
        window.location.href = "admin.html";

      } catch (error) {
        errorMsg.style.color = "#ef4444";
        errorMsg.innerText = "Invalid Email or Password!";
      }
    });
  </script>
</body>
</html>
