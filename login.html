<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Hanguk Haven</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+KR:wght@200;300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css"> 
  
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(201,169,97,.05) 0%, transparent 60%);
      padding: 20px;
    }
    .auth-box {
      background: var(--bg-2);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .auth-box h2 {
      font-family: var(--font-kr);
      color: var(--gold-lite);
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .auth-box .form-group { margin-bottom: 15px; }
    .auth-box input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(201, 169, 97, 0.3);
      padding: 12px 5px;
      color: var(--cream);
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.3s;
    }
    .auth-box input:focus { border-bottom-color: var(--gold); }
    .auth-btn {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      cursor: none;
      margin-top: 20px;
      transition: 0.3s;
    }
    .auth-btn:hover { background: var(--gold-lite); }
    .toggle-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .toggle-text span {
      color: var(--gold);
      cursor: none;
      text-decoration: underline;
    }
    #registerForm { display: none; }
  </style>
</head>
<body>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="auth-container">
    <div class="auth-box">
      <h2>달빛사찰</h2>

      <form id="loginForm">
        <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div>
        <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" required></div>
        <button type="submit" class="auth-btn">Log In</button>
        
        <div style="display: flex; align-items: center; margin: 20px 0;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
          <span style="padding: 0 10px; color: var(--text-dim); font-size: 0.8rem;">OR</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
        </div>
        
        <button type="button" id="googleLoginBtn" style="width: 100%; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--cream); font-family: var(--font-sans); cursor: none; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
          Continue with Google
        </button>

        <p class="toggle-text">Don't have an account? <span onclick="toggleForms()">Register here</span></p>
      </form>

      <form id="registerForm">
        <div class="form-group"><input type="text" id="regName" placeholder="Username" required></div>
        <div class="form-group"><input type="email" id="regEmail" placeholder="Gmail / Email" required></div>
        <div class="form-group"><input type="tel" id="regPhone" placeholder="Mobile Number" required></div>
        <div class="form-group"><input type="text" id="regAddress" placeholder="Delivery Address" required></div>
        <div class="form-group"><input type="password" id="regPassword" placeholder="Password (min 6 chars)" required minlength="6"></div>
        <button type="submit" class="auth-btn">Create Account</button>
        <p class="toggle-text">Already have an account? <span onclick="toggleForms()">Log in here</span></p>
      </form>
      
      <p id="message" style="text-align:center; color:#ff6b6b; margin-top:15px; font-size:0.9rem;"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxjDMZGVPRfx1altzXvwNKnu9sjdfk8kk",
      authDomain: "korean-cafe-b26a8.firebaseapp.com",
      projectId: "korean-cafe-b26a8",
      storageBucket: "korean-cafe-b26a8.firebasestorage.app",
      messagingSenderId: "823464413100",
      appId: "1:823464413100:web:444b9b7bdf37826de89c09",
      measurementId: "G-ZDPWRWL54R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if(dot) { dot.style.left = mx + 'px'; dot.style.top = my + 'px'; }
    });

    function animateRing() {
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      if(ring) { ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; }
      requestAnimationFrame(animateRing);
    }
    animateRing();

    document.querySelectorAll('a, button, input, select, textarea, span').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });

    window.toggleForms = () => {
      const lf = document.getElementById('loginForm');
      const rf = document.getElementById('registerForm');
      if(lf.style.display === 'none') {
        lf.style.display = 'block'; rf.style.display = 'none';
      } else {
        lf.style.display = 'none'; rf.style.display = 'block';
      }
      document.getElementById('message').innerText = "";
    };

    const googleBtn = document.getElementById('googleLoginBtn');
    const provider = new GoogleAuthProvider();

    googleBtn.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
         
          await setDoc(userRef, {
            username: user.displayName,
            email: user.email,
            phone: "",
            address: "",
            createdAt: new Date()
          });
        }
        window.location.href = "index.html";
      } catch (error) {
        document.getElementById('message').innerText = error.message;
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const address = document.getElementById('regAddress').value;
      const password = document.getElementById('regPassword').value;
      const msg = document.getElementById('message');

      try {
        msg.style.color = "var(--gold)"; msg.innerText = "Creating account...";
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          username: name, email: email, phone: phone, address: address, createdAt: new Date()
        });
        window.location.href = "index.html";
      } catch (error) {
        msg.style.color = "#ff6b6b"; msg.innerText = error.message;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('message');

      try {
        msg.style.color = "var(--gold)"; msg.innerText = "Logging in...";
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html"; 
      } catch (error) {
        msg.style.color = "#ff6b6b"; msg.innerText = "Invalid Email or Password!";
      }
    });
  </script>
</body>
</html>
