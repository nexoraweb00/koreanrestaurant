<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Offer · Hanguk Haven</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+KR:wght@200;300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <style>
  
    .offer-container { padding: 120px 20px 60px; max-width: 1250px; margin: 0 auto; min-height: 100vh; }
    .offer-header { text-align: center; margin-bottom: 50px; }
    .offer-header h1 { font-family: var(--font-serif); color: var(--gold-lite); font-size: 3rem; }
    .offer-header p { color: var(--text-dim); letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.8rem; margin-top: 10px; }
    
    .back-btn { position: absolute; top: 40px; left: 40px; color: var(--gold); text-decoration: none; font-family: var(--font-serif); letter-spacing: 0.1em; font-size: 1.1rem; z-index: 10; cursor: none; }

    .old-price { text-decoration: line-through; color: #888; font-size: 0.9rem; margin-right: 8px; }
    .new-price { color: #ff4d4d; font-weight: bold; font-size: 1.4rem; }
    .discount-badge { position: absolute; top: 15px; right: 15px; background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
    
    .menu-tabs { margin-top: 30px; }
  </style>
</head>
<body>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <div class="offer-container">
    <div class="offer-header">
      <h1 id="offerTitle">Special Offer</h1>
      <p>Exclusive Dishes</p>
    </div>

    <div class="menu-tabs reveal">
      <button class="tab-btn active" data-tab="appetizers">Appetizers<span class="kr">전채</span></button>
      <button class="tab-btn" data-tab="mains">Mains<span class="kr">요리</span></button>
      <button class="tab-btn" data-tab="desserts">Desserts<span class="kr">디저트</span></button>
      <button class="tab-btn" data-tab="drinks">Tea & Drinks<span class="kr">음료</span></button>
    </div>

    <div class="menu-panel active" data-panel="appetizers" id="offer-appetizers"></div>
    <div class="menu-panel" data-panel="mains" id="offer-mains"></div>
    <div class="menu-panel" data-panel="desserts" id="offer-desserts"></div>
    <div class="menu-panel" data-panel="drinks" id="offer-drinks"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

   
    const firebaseConfig = { 
      apiKey: "AIzaSyBxjDMZGVPRfx1altzXvwNKnu9sjdfk8kk",
  authDomain: "korean-cafe-b26a8.firebaseapp.com",
  projectId: "korean-cafe-b26a8",
  storageBucket: "korean-cafe-b26a8.firebasestorage.app",
  messagingSenderId: "823464413100",
  appId: "1:823464413100:web:444b9b7bdf37826de89c09",
  measurementId: "G-ZDPWRWL54R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const bannerId = urlParams.get('id');
    const title = document.getElementById('offerTitle');

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.menu-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(`.menu-panel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
      });
    });

    if (bannerId) {
      try {
       
        const bannerSnap = await getDoc(doc(db, "banners", bannerId));
        if (bannerSnap.exists()) {
          const bannerData = bannerSnap.data();
          title.innerText = bannerData.text || "Special Offer";
          
          const dishIds = bannerData.dishes || [];
          const discount = bannerData.discount || 0;

          const menuSnap = await getDocs(collection(db, "menu"));
          
          let hasItems = false; 

          menuSnap.forEach(dishDoc => {
            if (dishIds.includes(dishDoc.id)) {
              hasItems = true;
              const dish = dishDoc.data();
              const originalPrice = dish.price;
              
              let priceHTML = `<span class="card-price">Rs. ${originalPrice}</span>`;
              let badgeHTML = "";

              if (discount > 0) {
                const discountedPrice = Math.round(originalPrice - (originalPrice * (discount / 100)));
                priceHTML = `
                  <span class="old-price">Rs. ${originalPrice}</span>
                  <span class="new-price">Rs. ${discountedPrice}</span>
                `;
                badgeHTML = `<div class="discount-badge">${discount}% OFF</div>`;
              }

              const targetPanel = document.getElementById(`offer-${dish.category}`);
              
              if (targetPanel) {
                
                targetPanel.innerHTML += `
                  <a href="order.html?id=${dishDoc.id}&discount=${discount}" class="menu-card" style="text-decoration: none; color: inherit; display: flex;">
                    <div class="card-img">
                      ${badgeHTML}
                      <img src="${dish.image}" alt="${dish.name_en}">
                    </div>
                    <div class="card-content">
                      <h3 class="card-title">${dish.name_kr} <span class="en">${dish.name_en}</span></h3>
                      <p class="card-desc">${dish.desc}</p>
                      <div class="card-footer">
                        <div>${priceHTML}</div>
                        <button class="card-btn" style="pointer-events: none;">+</button>
                      </div>
                    </div>
                  </a>
                `;
              }
            }
          });

          if (!hasItems) {
             document.querySelectorAll('.menu-panel').forEach(panel => {
                 panel.innerHTML = "<p style='color:white; text-align:center; grid-column: 1/-1;'>No items in this offer.</p>";
             });
          }
        }
      } catch (error) {
        console.error("Error loading offer:", error);
      }
    }

    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if(dot) { dot.style.left = mx + 'px'; dot.style.top = my + 'px'; }
    });
    function animateRing() {
      rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
      if(ring) { ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; }
      requestAnimationFrame(animateRing);
    }
    animateRing();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>
</body>
</html>
